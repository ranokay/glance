name: Production Verification

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
      - "LICENSE.md"
      - "PRIVACY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust, Xcode, and release gates
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned tool downloads (keyed by tool-versions hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ hashFiles('mise.toml') }}
          restore-keys: mise-

      - name: Shared toolchain and pinned tools
        uses: ./.github/actions/setup
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Rust compiler outputs
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          working-directory: PreviewCore
          save-on-pull-request: true
          save-on-workflow-dispatch: true

      - name: Check release metadata strings
        run: |
          set -euo pipefail
          sh scripts/check-release-metadata.sh

      - name: Run production verification (lint gate first, no mid-run wipe)
        run: |
          set -euo pipefail
          mise run verify
          mise run verify:app 2>&1 | tee build/verify-app.log

      - name: Retain evidence bundle keyed by commit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-evidence-${{ github.sha }}
          path: |
            build/TestResults/Glance.xcresult
            build/verify-app.log
          if-no-files-found: warn
