name: Production Verification

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
      - "LICENSE.md"
      - "PRIVACY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust, Xcode, and release gates
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Shared toolchain and pinned tools
        uses: ./.github/actions/setup
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache pinned tool downloads (keyed by tool-versions hash)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ hashFiles('mise.toml') }}
          restore-keys: mise-

      - name: Cache Rust build (keyed by lockfile plus toolchain version)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PreviewCore/target
          key: rust-1.97.1-${{ hashFiles('PreviewCore/Cargo.lock') }}
          restore-keys: rust-1.97.1-

      - name: Check release metadata strings
        run: |
          set -euo pipefail
          sh scripts/check-release-metadata.sh

      - name: Run production verification (lint gate first, no mid-run wipe)
        run: |
          set -euo pipefail
          mise run verify
          mise run verify:app 2>&1 | tee build/verify-app.log

      - name: Run scripted Quick Look corpus (fuzzy, fail on missing/crash)
        run: |
          set -euo pipefail
          sh scripts/qlmanage-corpus.sh 2>&1 | tee build/qlmanage-corpus.log

      - name: Retain evidence bundle keyed by commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ github.sha }}
          path: |
            build/TestResults/Glance.xcresult
            build/verify-app.log
            build/qlmanage-corpus.log
          if-no-files-found: warn
