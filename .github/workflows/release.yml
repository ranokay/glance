name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Shared toolchain and pinned tools
        uses: ./.github/actions/setup
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache pinned tool downloads (keyed by tool-versions hash)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ hashFiles('mise.toml') }}
          restore-keys: mise-

      - name: Cache Rust build (keyed by lockfile plus toolchain version)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PreviewCore/target
          key: rust-1.97.1-${{ hashFiles('PreviewCore/Cargo.lock') }}
          restore-keys: rust-1.97.1-

      - name: Run production verification
        run: |
          set -euo pipefail
          mise run verify

      - name: Verify release app
        run: |
          set -euo pipefail
          mise run verify:app 2>&1 | tee build/verify-app.log

      - name: Package DMG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          APP_NAME="Glance"
          APP_PATH="build/Build/Products/Release/${APP_NAME}.app"
          DIST_DIR="dist"
          STAGING_DIR="${DIST_DIR}/dmg-root"
          DMG_PATH="${DIST_DIR}/${APP_NAME}-${VERSION}.dmg"

          test -d "$APP_PATH"

          rm -rf "$DIST_DIR"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          (
            cd "$DIST_DIR"
            shasum -a 256 "$(basename "$DMG_PATH")" | tee "$(basename "$DMG_PATH").sha256"
          )

      - name: Verify DMG contents
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          DMG_PATH="dist/Glance-${VERSION}.dmg"
          MOUNT_DIR="$(mktemp -d)"

          (cd dist && shasum -a 256 -c "Glance-${VERSION}.dmg.sha256")
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT_DIR" -quiet || true; rmdir "$MOUNT_DIR" || true' EXIT

          test -d "$MOUNT_DIR/Glance.app"
          test -d "$MOUNT_DIR/Glance.app/Contents/PlugIns/QLPlugin.appex"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$MOUNT_DIR/Glance.app/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/Glance.app"
          QL_EXECUTABLE="$MOUNT_DIR/Glance.app/Contents/PlugIns/QLPlugin.appex/Contents/MacOS/QLPlugin"
          lipo -info "$QL_EXECUTABLE" | grep -q "arm64"
          if lipo -info "$QL_EXECUTABLE" | grep -q "x86_64"; then
            echo "Published Quick Look executable contains x86_64" >&2
            exit 1
          fi
          if strings "$QL_EXECUTABLE" | grep -Eq 'go\.buildid|runtime\.morestack|github\.com/alecthomas/chroma|github\.com/yuin/goldmark'; then
            echo "Published Quick Look executable contains the removed Go runtime" >&2
            exit 1
          fi

          hdiutil detach "$MOUNT_DIR" -quiet
          trap - EXIT
          rmdir "$MOUNT_DIR"

      - name: Extract current version release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          awk -v version="$VERSION" '
            /^# Glance / { if (found) exit; if ($0 == "# Glance " version) found=1; next }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            "dist/Glance-${VERSION}.dmg" \
            "dist/Glance-${VERSION}.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Glance ${VERSION}" \
            --notes-file dist/release-notes.md
