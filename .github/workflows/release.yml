name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Assert macOS 26 Apple Silicon toolchain
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Release builds must run on Apple Silicon, got $(uname -m)" >&2
            exit 1
          fi

          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          if [ "$macos_major" != "26" ]; then
            echo "Release builds require macOS 26, got $(sw_vers -productVersion)" >&2
            exit 1
          fi

          xcode_major="$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')"
          if [ "$xcode_major" != "26" ]; then
            echo "Release builds require Xcode 26, got $(xcodebuild -version | head -1)" >&2
            exit 1
          fi

      - name: Install mise
        run: |
          set -euo pipefail
          MISE_VERSION="2026.6.0"
          MISE_ARCH="arm64"
          MISE_SHA256="8830cf720025583bfbc5ca77bcf15958bf6efb4743fb84be6b572fd85d3a6cd0"

          MISE_TARBALL="mise-v${MISE_VERSION}-macos-${MISE_ARCH}.tar.gz"
          curl -fsSLO "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/${MISE_TARBALL}"
          echo "${MISE_SHA256}  ${MISE_TARBALL}" | shasum -a 256 -c -
          tar -xzf "$MISE_TARBALL"
          mkdir -p "$HOME/.local/bin"
          cp mise/bin/mise "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          mise --version

      - name: Install pinned tools
        env:
          MISE_YES: "1"
        run: |
          set -euo pipefail
          mise trust mise.toml
          mise install
          mise exec -- rustup component add rustfmt clippy

      - name: Run production verification
        run: |
          set -euo pipefail
          mise run verify

      - name: Verify release app
        run: |
          set -euo pipefail
          mise run verify:app

      - name: Package DMG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          APP_NAME="Glance"
          APP_PATH="build/Build/Products/Release/${APP_NAME}.app"
          DIST_DIR="dist"
          STAGING_DIR="${DIST_DIR}/dmg-root"
          DMG_PATH="${DIST_DIR}/${APP_NAME}-${VERSION}.dmg"

          test -d "$APP_PATH"

          rm -rf "$DIST_DIR"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          (
            cd "$DIST_DIR"
            shasum -a 256 "$(basename "$DMG_PATH")" | tee "$(basename "$DMG_PATH").sha256"
          )

      - name: Verify DMG contents
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          DMG_PATH="dist/Glance-${VERSION}.dmg"
          MOUNT_DIR="$(mktemp -d)"

          (cd dist && shasum -a 256 -c "Glance-${VERSION}.dmg.sha256")
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT_DIR" -quiet || true; rmdir "$MOUNT_DIR" || true' EXIT

          test -d "$MOUNT_DIR/Glance.app"
          test -d "$MOUNT_DIR/Glance.app/Contents/PlugIns/QLPlugin.appex"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$MOUNT_DIR/Glance.app/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/Glance.app"
          QL_EXECUTABLE="$MOUNT_DIR/Glance.app/Contents/PlugIns/QLPlugin.appex/Contents/MacOS/QLPlugin"
          lipo -info "$QL_EXECUTABLE" | grep -q "arm64"
          if lipo -info "$QL_EXECUTABLE" | grep -q "x86_64"; then
            echo "Published Quick Look executable contains x86_64" >&2
            exit 1
          fi
          if strings "$QL_EXECUTABLE" | grep -Eq 'go\.buildid|runtime\.morestack|github\.com/alecthomas/chroma|github\.com/yuin/goldmark'; then
            echo "Published Quick Look executable contains the removed Go runtime" >&2
            exit 1
          fi

          hdiutil detach "$MOUNT_DIR" -quiet
          trap - EXIT
          rmdir "$MOUNT_DIR"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            "dist/Glance-${VERSION}.dmg" \
            "dist/Glance-${VERSION}.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Glance ${VERSION}" \
            --notes-file RELEASE_NOTES.md
