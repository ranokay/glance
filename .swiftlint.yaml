# Source: https://github.com/sindresorhus/swiftlint-sindre (with modifications)

# SwiftFormat owns layout and whitespace (see `.swiftformat`); this file owns
# semantics. Rules covered by SwiftFormat are commented out.
only_rules:
  - array_init
  - attributes
  - block_based_kvo
  - class_delegate_protocol
  - closure_parameter_position
  - closure_spacing
  - compiler_protocol_init
  - conditional_returns_on_newline
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - control_statement
  - deployment_target
  - discarded_notification_center_observer
  - discouraged_direct_init
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - duplicate_enum_cases
  - duplicate_imports
  - dynamic_inline
  - empty_collection_literal
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - for_where
  - generic_type_name
  - identical_operands
  - identifier_name
  - implicit_getter
  - implicit_return
  - is_disjoint
  - joined_default_parameter
  - last_where
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_multiple
  - legacy_nsgeometry_functions
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - mark
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - no_extension_access_modifier
  - no_fallthrough_only
  - no_space_in_method_call
  - notification_center_detachment
  - nsobject_prefer_isequal
  - function_name_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - private_action
  - private_outlet
  - prohibited_super_call
  - protocol_property_accessors_order
  - reduce_boolean
  - reduce_into
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - implicit_optional_initialization
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_type_annotation
  - redundant_void_return
  - required_enum_case
  - shorthand_operator
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - superfluous_disable_command
  # - switch_case_alignment
  - switch_case_on_newline
  - syntactic_sugar
  # - todo
  - toggle_bool
  # - trailing_closure
  # - trailing_comma
  # - trailing_newline
  # - trailing_semicolon
  # - trailing_whitespace
  - type_name
  - unavailable_function
  - unneeded_break_in_switch
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value
  - valid_ibinspectable
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - void_return
  - weak_delegate
  - xct_specific_matcher
  - xctfail_message
  - yoda_condition

  # Swift 6-era correctness rules.
  - blanket_disable_command
  - duplicate_conditions
  - force_cast
  - force_try
  - invalid_swiftlint_command
  - invisible_character
  - non_optional_string_data_conversion
  - optional_data_string_conversion
  - prefer_type_checking
  - private_over_fileprivate
  - redundant_sendable
  - unavailable_condition
  - unhandled_throwing_task
  - unneeded_override
  - unneeded_synthesized_initializer
  - void_function_in_ternary

# `unused_declaration` and `unused_import` need `swiftlint analyze` with a
# compiler log, which no task runs. Omit until it is wired into CI.
excluded:
  - build
  - PreviewCore/target
  - PreviewCore/build
identifier_name:
  max_length:
    warning: 50
    error: 50
  min_length:
    warning: 2
    error: 2
  validates_start_with_lowercase: false
  allowed_symbols:
    - "_"
  excluded:
    - "x"
    - "y"
    - "a"
    - "b"
    - "x1"
    - "x2"
    - "y1"
    - "y2"
