[tools]
"cargo:cargo-audit" = "0.22.2"
rust = "1.97.1"
swiftformat = "0.61.1"
swiftlint = "0.63.3"

[tasks.build]
description = "Build the application incrementally in the build directory"
run = '''
set -e
APP_NAME="${APP_NAME:-Glance}"
echo "Building Quick Look extension..."
xcodebuild -scheme "$APP_NAME" -configuration Release -derivedDataPath build build
echo "Build complete"
'''

[tasks.install]
description = "Install the application into INSTALL_PATH, /Applications by default"
run = '''
set -e
if [ "${GLANCE_CONFIRM_DESTRUCTIVE:-}" != "1" ]; then
	echo "Human gate: install removes $INSTALL_PATH/${APP_NAME:-Glance}.app unattended." >&2
	echo "Re-run with GLANCE_CONFIRM_DESTRUCTIVE=1 after confirming the target path." >&2
	exit 1
fi
APP_NAME="${APP_NAME:-Glance}"
INSTALL_PATH="${INSTALL_PATH:-/Applications}"
echo "Installing to $INSTALL_PATH..."
rm -rf "$INSTALL_PATH/$APP_NAME.app"
cp -R "build/Build/Products/Release/$APP_NAME.app" "$INSTALL_PATH/"
echo "Installed to $INSTALL_PATH/$APP_NAME.app"
'''

[tasks.register]
description = "Register the Quick Look extension with pluginkit"
run = '''
set -e
APP_NAME="${APP_NAME:-Glance}"
INSTALL_PATH="${INSTALL_PATH:-/Applications}"
echo "Registering extension with system..."
pluginkit -a "$INSTALL_PATH/$APP_NAME.app/Contents/PlugIns/QLPlugin.appex" || true
echo "Registration complete"
'''

[tasks.reset]
description = "Reset Quick Look (destructive: restarts Finder/quicklookd)"
run = '''
set -e
if [ "${GLANCE_CONFIRM_DESTRUCTIVE:-}" != "1" ]; then
	echo "Human gate: reset kills Finder and quicklookd." >&2
	echo "Re-run with GLANCE_CONFIRM_DESTRUCTIVE=1 when a GUI session can tolerate it." >&2
	exit 1
fi
echo "Resetting Quick Look..."
qlmanage -r
qlmanage -r cache
killall Finder 2>/dev/null || true
killall quicklookd 2>/dev/null || true
echo "Quick Look reset"
'''

[tasks.check]
description = "Check whether the Quick Look extension is installed"
run = '''
set -e
APP_NAME="${APP_NAME:-Glance}"
INSTALL_PATH="${INSTALL_PATH:-/Applications}"
echo "Checking extension status..."
echo ""
echo "Extension registration:"
pluginkit -m -A -D -v | grep -A3 -i "$APP_NAME" || echo "Not registered"
echo ""
echo "Installed location:"
ls -la "$INSTALL_PATH/$APP_NAME.app/Contents/PlugIns/"*.appex 2>/dev/null || echo "Not found"
echo ""
'''

[tasks.clean]
description = "Clean build artifacts (destructive: wipes shared DerivedData and full cargo target)"
run = '''
set -e
if [ "${GLANCE_CONFIRM_DESTRUCTIVE:-}" != "1" ]; then
	echo "Human gate: clean wipes shared DerivedData and the full cargo target." >&2
	echo "Re-run with GLANCE_CONFIRM_DESTRUCTIVE=1 to confirm." >&2
	exit 1
fi
APP_NAME="${APP_NAME:-Glance}"
echo "Cleaning build artifacts..."
rm -rf build
rm -rf "$HOME/Library/Developer/Xcode/DerivedData/$APP_NAME"-*
cargo clean --manifest-path PreviewCore/Cargo.toml
rm -rf PreviewCore/build
echo "Clean complete"
'''

[tasks.uninstall]
description = "Uninstall the application from INSTALL_PATH, /Applications by default (destructive)"
run = '''
set -e
if [ "${GLANCE_CONFIRM_DESTRUCTIVE:-}" != "1" ]; then
	echo "Human gate: uninstall removes the installed app and wipes build state." >&2
	echo "Re-run with GLANCE_CONFIRM_DESTRUCTIVE=1 to confirm." >&2
	exit 1
fi
APP_NAME="${APP_NAME:-Glance}"
INSTALL_PATH="${INSTALL_PATH:-/Applications}"
echo "Uninstalling..."
pluginkit -r "$INSTALL_PATH/$APP_NAME.app/Contents/PlugIns/QLPlugin.appex" 2>/dev/null || true
rm -rf "$INSTALL_PATH/$APP_NAME.app"
mise run clean
mise run reset
echo "Uninstalled"
'''

[tasks.all]
description = "Build, install, register, and reset Quick Look"
run = '''
set -e
mise run install
mise run register
mise run reset
'''

[tasks."test:rust"]
description = "Check and test PreviewCore with the pinned Rust toolchain"
run = '''
set -e
cargo fmt --manifest-path PreviewCore/Cargo.toml --check
cargo clippy --manifest-path PreviewCore/Cargo.toml --locked --all-targets -- -D warnings
cargo test --manifest-path PreviewCore/Cargo.toml --locked
'''

[tasks."audit:rust"]
description = "Audit PreviewCore's locked Rust dependency graph"
run = '''
# syntect 5.3.0 still requires these two unmaintained serialization crates. Neither advisory
# reports a vulnerability, and both are isolated behind two-face's bundled syntax data.
cargo audit --file PreviewCore/Cargo.lock --deny warnings \
	--ignore RUSTSEC-2025-0141 \
	--ignore RUSTSEC-2024-0320
'''

[tasks."test:xcode"]
description = "Run Xcode tests (Debug, isolated dir, retained result bundle)"
run = '''
set -e
APP_NAME="${APP_NAME:-Glance}"
xcodebuild test -scheme "$APP_NAME" -configuration Debug -derivedDataPath build/test -resultBundlePath build/TestResults/Glance.xcresult -quiet
'''

[tasks.test]
description = "Run all tests"
run = '''
set -e
mise run test:rust
mise run test:xcode
'''

[tasks.lint]
description = "Run pinned Swift lint and format checks (merge gate)"
run = '''
set -e
swiftlint lint --strict
swiftformat --lint .
'''

[tasks.verify]
description = "Run tests, audit, then build the release app (no wipe; test artifacts survive)"
run = '''
set -e
mise run lint
mise run test
mise run audit:rust
mise run build
'''

[tasks."verify:app"]
description = "Verify release architecture, deployment target, runtimes, and signatures"
run = '''
set -e
APP_NAME="${APP_NAME:-Glance}"
APP_PATH="build/Build/Products/Release/$APP_NAME.app"
RUST_ARCHIVE="PreviewCore/build/Release/libglance_preview_core.a"
QL_EXECUTABLE="$APP_PATH/Contents/PlugIns/QLPlugin.appex/Contents/MacOS/QLPlugin"

test -d "$APP_PATH"
test -f "$RUST_ARCHIVE"
test -x "$QL_EXECUTABLE"

lipo -info "$RUST_ARCHIVE" | grep -q "arm64"
if lipo -info "$RUST_ARCHIVE" | grep -q "x86_64"; then
	echo "PreviewCore archive contains x86_64" >&2
	exit 1
fi

found_macho=0
candidate_list="$(mktemp)"
trap 'rm -f "$candidate_list"' EXIT
find "$APP_PATH" -type f -print > "$candidate_list"
while IFS= read -r candidate; do
	if info="$(lipo -info "$candidate" 2>/dev/null)"; then
		found_macho=1
		echo "$info"
		echo "$info" | grep -q "arm64"
		if echo "$info" | grep -q "x86_64"; then
			echo "Bundle artifact contains x86_64: $candidate" >&2
			exit 1
		fi
		xcrun vtool -show-build "$candidate" | grep -q "minos 26.0"
	fi
done < "$candidate_list"
test "$found_macho" -eq 1

if strings "$QL_EXECUTABLE" | grep -Eq 'go\.buildid|runtime\.morestack|github\.com/alecthomas/chroma|github\.com/yuin/goldmark'; then
	echo "Quick Look executable still contains the removed Go runtime" >&2
	exit 1
fi
if find "$APP_PATH" -type d \( -name SwiftCSV.framework -o -name ZIPFoundation.framework -o -name SWCompression.framework -o -name BitByteData.framework \) | grep -q .; then
	echo "App bundle contains a removed Swift parser framework" >&2
	exit 1
fi

codesign --verify --deep --strict --verbose=2 "$APP_PATH"

echo "--- pin cadence ---"
grep -E '^(rust|swiftformat|swiftlint|"cargo:cargo-audit")' mise.toml || true
echo "--- entitlement review (least-privilege: sandbox + network.client, plugin adds user-selected.read-only) ---"
codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | grep -E "com.apple.security" || true
codesign -d --entitlements :- "$QL_EXECUTABLE" 2>/dev/null | grep -E "com.apple.security" || true
'''
